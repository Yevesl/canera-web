<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Camera</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Camera">
<meta name="color-scheme" content="dark">
<style>
:root{
  --bar-top:linear-gradient(rgba(88,88,94,.82),rgba(8,8,10,.9));
  --bar-bottom:linear-gradient(#3e3e42,#060608);
  --btn:linear-gradient(#78787e 0,#4a4a50 50%,#222226 51%,#3a3a40 100%);
  --silver:linear-gradient(#f4f4f7 0,#d2d2d9 50%,#b6b6be 51%,#9d9da6 100%);
  --silver-down:linear-gradient(#bdbdc4 0,#9b9ba3 50%,#85858e 51%,#6f6f79 100%);
  --blue:linear-gradient(#8dbaf7 0,#4d8de6 50%,#1f62c9 51%,#2f78dd 100%);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#000;color:#fff;overflow:hidden;
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;touch-action:manipulation}
#stage{position:fixed;inset:0;background:#111;overflow:hidden;touch-action:none}
video{width:100%;height:100%;object-fit:cover;display:block;transform:scaleX(var(--mx,1)) scale(var(--z,1))}
video.mirror{--mx:-1}
video.retro{filter:saturate(1.18) contrast(1.12) brightness(.93) blur(.4px)}
.top,.bottom{position:fixed;left:0;right:0;z-index:5}
.top{top:0;padding:calc(10px + var(--safe-t)) 12px 10px;background:var(--bar-top);
  border-bottom:1px solid #000;display:flex;justify-content:space-between;align-items:center}
.bottom{bottom:0;padding:16px 18px calc(16px + var(--safe-b));background:var(--bar-bottom);
  border-top:1px solid #000;box-shadow:inset 0 1px 0 rgba(255,255,255,.35);
  display:flex;justify-content:space-between;align-items:center}
.btn{border:1px solid #000;border-radius:8px;background:var(--btn);color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 1px 0 rgba(255,255,255,.12);
  height:32px;padding:0 12px;display:flex;align-items:center;gap:6px;
  font:bold 15px "Helvetica Neue",Helvetica,Arial,sans-serif;text-shadow:0 -1px 0 rgba(0,0,0,.6)}
.btn:active{filter:brightness(.7)}
.btn.small{height:30px;font-size:14px}
.btn svg{display:block}
#flash.off svg{opacity:.45}
#shutter{width:112px;height:60px;border:1px solid #111;border-radius:14px;background:var(--silver);
  display:flex;align-items:center;justify-content:center;color:#34343a;--hole:#c4c4cc;
  box-shadow:inset 0 1px 0 #fff,0 1px 0 rgba(255,255,255,.2)}
#shutter:active{background:var(--silver-down);--hole:#7c7c86}
#shutter .dot{width:34px;height:34px;border-radius:50%;border:1px solid #4a0000;
  background:radial-gradient(circle at 50% 22%,#ff9d93,#d41a10 55%,#8c0000);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
#shutter:not(.vid) .dot,#shutter.vid .ico{display:none}
#shutter.rec .dot{animation:pulse 1s steps(1) infinite}
@keyframes pulse{50%{opacity:0}}
#timer{position:absolute;left:50%;transform:translateX(-50%);top:calc(10px + var(--safe-t));height:32px;
  background:rgba(0,0,0,.65);border-radius:16px;padding:0 14px 0 10px;display:flex;align-items:center;gap:8px;
  font:bold 18px "Helvetica Neue",Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}
#timer i{width:12px;height:12px;border-radius:50%;background:#eb1e1e;animation:pulse 1s steps(1) infinite}
#zoombar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + var(--safe-b));z-index:6;
  width:min(78%,320px);height:34px;border-radius:17px;border:1px solid #000;padding:0 12px;
  background:linear-gradient(rgba(10,10,12,.88),rgba(72,72,78,.88));box-shadow:inset 0 2px 4px #000;
  display:flex;align-items:center;gap:10px;transition:opacity .3s}
#zoombar.hide{opacity:0;pointer-events:none}
#zoombar b{font-size:22px;line-height:1;color:#c8c8ce;width:16px;text-align:center;cursor:pointer}
#zr{flex:1;min-width:0;-webkit-appearance:none;appearance:none;background:transparent;height:30px;margin:0}
#zr::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:#050506;box-shadow:0 1px 0 rgba(255,255,255,.18)}
#zr::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-11px;border-radius:50%;
  border:1px solid #222;background:var(--silver);box-shadow:inset 0 1px 0 #fff,0 1px 3px #000}
#zr::-moz-range-track{height:4px;border-radius:2px;background:#050506}
#zr::-moz-range-thumb{width:24px;height:24px;border-radius:50%;border:1px solid #222;background:#d2d2d9}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + var(--safe-b));z-index:6;
  background:rgba(0,0,0,.78);padding:8px 14px;border-radius:14px;font-size:14px;max-width:80%;text-align:center}
#thumb{width:52px;height:52px;border-radius:6px;border:2px solid #ececec;
  background:#2a2a2e center/cover no-repeat;box-shadow:0 1px 3px #000}
#switch{width:80px;height:34px;border-radius:17px;border:1px solid #000;
  background:linear-gradient(#141416,#4b4b50);box-shadow:inset 0 2px 4px #000;position:relative;--hole:#2a62b5}
#switch .knob{position:absolute;left:2px;top:2px;width:42px;height:28px;border-radius:14px;
  background:var(--blue);border:1px solid #0a2a66;display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
#switch .gc{position:absolute;left:9px;top:8px;color:#97979d}
#switch .gv{position:absolute;right:10px;top:9px;color:#97979d}
#switch .knob{transition:left .18s}
#switch.vid .knob{left:34px}
#switch .kv{display:none}
#switch.vid .kv{display:block}
#switch.vid .kc{display:none}
.focus{position:fixed;width:84px;height:84px;margin:-42px 0 0 -42px;z-index:4;pointer-events:none;
  border:2px solid #fff;opacity:0;animation:focus 1s ease-out forwards;
  background:
   linear-gradient(#fff,#fff) top center/2px 8px no-repeat,
   linear-gradient(#fff,#fff) bottom center/2px 8px no-repeat,
   linear-gradient(#fff,#fff) center left/8px 2px no-repeat,
   linear-gradient(#fff,#fff) center right/8px 2px no-repeat}
@keyframes focus{0%{transform:scale(1.6);opacity:0}15%{opacity:1}35%{transform:scale(1)}75%{opacity:1}100%{opacity:0}}
#blink{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden}
#blink i{position:absolute;left:0;right:0;height:50%;background:#000}
#blink .t{top:0;transform:translateY(-100%)}
#blink .b{bottom:0;transform:translateY(100%)}
#blink.go .t{animation:bt .32s ease-in-out}
#blink.go .b{animation:bb .32s ease-in-out}
@keyframes bt{0%,100%{transform:translateY(-100%)}40%,60%{transform:translateY(0)}}
@keyframes bb{0%,100%{transform:translateY(100%)}40%,60%{transform:translateY(0)}}
#grid{position:fixed;inset:0;z-index:2;pointer-events:none;
  background:
   linear-gradient(90deg,transparent calc(33.33% - .5px),rgba(255,255,255,.55) 0 calc(33.33% + .5px),transparent 0 calc(66.66% - .5px),rgba(255,255,255,.55) 0 calc(66.66% + .5px),transparent 0),
   linear-gradient(transparent calc(33.33% - .5px),rgba(255,255,255,.55) 0 calc(33.33% + .5px),transparent 0 calc(66.66% - .5px),rgba(255,255,255,.55) 0 calc(66.66% + .5px),transparent 0)}
#sqmask{position:fixed;left:50%;top:50%;width:min(100vw,100dvh);height:min(100vw,100dvh);
  transform:translate(-50%,-50%);z-index:2;pointer-events:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.88)}
#cd{position:fixed;inset:0;z-index:4;pointer-events:none;display:flex;align-items:center;justify-content:center;
  font:bold 130px "Helvetica Neue",Helvetica,Arial,sans-serif;text-shadow:0 2px 12px #000}
#opts{position:absolute;left:50%;transform:translateX(-50%)}
#panel{position:fixed;left:50%;transform:translateX(-50%);top:calc(56px + var(--safe-t));z-index:7;
  width:min(88%,330px);padding:4px 12px;border-radius:12px;border:1px solid #000;
  background:linear-gradient(rgba(74,74,80,.96),rgba(14,14,16,.96));box-shadow:0 4px 14px rgba(0,0,0,.7)}
#panel .row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-weight:bold;font-size:15px}
#panel .row+.row{border-top:1px solid #000;box-shadow:0 -1px 0 rgba(255,255,255,.12)}
.seg{display:flex}
.seg button{border:1px solid #000;margin-left:-1px;height:28px;min-width:48px;padding:0 10px;color:#fff;
  background:var(--btn);font:bold 14px "Helvetica Neue",Helvetica,Arial,sans-serif}
.seg button.on{background:var(--blue)}
.seg button:first-child{border-radius:7px 0 0 7px;margin-left:0}
.seg button:last-child{border-radius:0 7px 7px 0}
#msg{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:0 36px;color:#b5b5bb;font-size:17px;line-height:1.4}
#roll{position:fixed;inset:0;z-index:10;background:#000;display:flex;flex-direction:column}
#roll header{padding:calc(10px + var(--safe-t)) 12px 10px;background:var(--bar-top);
  display:flex;justify-content:space-between;align-items:center;font-weight:bold;border-bottom:1px solid #000}
#list{flex:1;overflow-y:auto;padding:12px 12px calc(12px + var(--safe-b));-webkit-overflow-scrolling:touch}
.item{margin-bottom:16px;display:flex;flex-direction:column;align-items:center;gap:8px}
.item img,.item video{max-width:100%;border-radius:4px;-webkit-user-select:auto;-webkit-touch-callout:default}
.hint,.empty{text-align:center;color:#8d8d93;font-size:13px;padding:6px 0}
.empty{padding:60px 0;font-size:17px}
</style>
</head>
<body ontouchstart="">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="cam" viewBox="0 0 46 34">
    <rect x="15" y="0" width="16" height="10" rx="3" fill="currentColor"/>
    <rect x="0" y="6" width="46" height="28" rx="5" fill="currentColor"/>
    <circle cx="23" cy="20" r="10.5" fill="var(--hole,#333)"/>
    <circle cx="23" cy="20" r="6.5" fill="currentColor"/>
  </symbol>
  <symbol id="bolt" viewBox="0 0 12 18"><polygon points="7.2,0 1.2,10.4 5.3,10.4 3.8,18 10.8,6.8 6.6,6.8" fill="currentColor"/></symbol>
  <symbol id="vid" viewBox="0 0 22 14"><rect width="15" height="14" rx="2.5" fill="currentColor"/><polygon points="16.3,4.9 22,1.4 22,12.6 16.3,9.1" fill="currentColor"/></symbol>
</svg>

<div id="stage"><video id="v" autoplay playsinline muted></video></div>
<div id="msg" hidden></div>
<div id="grid" hidden></div><div id="sqmask" hidden></div>
<div id="cd" hidden></div>
<div id="blink"><i class="t"></i><i class="b"></i></div>
<div id="panel" hidden></div>
<div id="toast" hidden></div>
<div id="zoombar" class="hide"><b id="zm">−</b><input id="zr" type="range" min="1" max="5" step="0.01" value="1" aria-label="Zoom"><b id="zp">+</b></div>

<div class="top">
  <button class="btn" id="flash" aria-label="Flash"><svg width="12" height="18"><use href="#bolt"/></svg><span id="flashLabel">Auto</span></button>
  <button class="btn" id="opts">Options</button>
  <div id="timer" hidden><i></i><span id="tt">00:00</span></div>
  <button class="btn" id="flip" aria-label="Switch camera" style="padding:0 16px"><svg width="30" height="22" style="--hole:#3d3d42"><use href="#cam"/></svg></button>
</div>

<div class="bottom">
  <div id="thumb" role="button" aria-label="Camera Roll"></div>
  <button id="shutter" aria-label="Shutter"><svg class="ico" width="46" height="34"><use href="#cam"/></svg><span class="dot"></span></button>
  <div id="switch" role="button" aria-label="Photo or video">
    <svg class="gc" width="24" height="17" style="--hole:#2a2a2e"><use href="#cam"/></svg>
    <svg class="gv" width="22" height="14"><use href="#vid"/></svg>
    <div class="knob">
      <svg class="kc" width="24" height="17" style="color:#fff;--hole:#2a62b5"><use href="#cam"/></svg>
      <svg class="kv" width="22" height="14" style="color:#fff"><use href="#vid"/></svg>
    </div>
  </div>
</div>

<div id="roll" hidden>
  <header><span style="width:60px"></span><span>Camera Roll</span><button class="btn small" id="done">Done</button></header>
  <div id="list"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const video = $('#v');
let facing = 'environment', stream = null, flashMode = 0, photos = [], ac;
let mode = 'photo', recording = false, recorder = null, chunks = [], recStart = 0, timerId = null, poster = '', toastId = null;
let zoom = 1, hwZoom = null, zoomTimer = null, pinch = null, cdId = null;
const opts = { retro: 1, grid: 0, timer: 0, square: 0 };
let retroSrc = null;
const flashLabels = ['Auto', 'On', 'Off'];

function showMsg(t){ const m = $('#msg'); m.textContent = t; m.hidden = false; }

function showCamError(e){
  const m = $('#msg'); m.textContent = '';
  const framed = window.self !== window.top;
  const p = document.createElement('div');
  p.textContent = (framed
    ? 'This page is running inside another page, which usually blocks the camera. Open it as its own web page instead.'
    : 'Camera unavailable. Tap the button and choose Allow when your browser asks.') + ' (' + ((e && e.name) || 'Error') + ')';
  const b = document.createElement('button'); b.className = 'btn'; b.textContent = 'Enable camera';
  b.style.marginTop = '16px'; b.onclick = () => start();
  m.append(p, b); m.hidden = false;
}

function toast(t){
  const el = $('#toast'); el.textContent = t; el.hidden = false;
  clearTimeout(toastId); toastId = setTimeout(() => { el.hidden = true; }, 3000);
}

async function start(){
  if (stream) stream.getTracks().forEach(t => t.stop());
  const vid = { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1440 } };
  const wantAudio = mode === 'video';
  try {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: vid, audio: wantAudio });
    } catch (e) {
      if (!wantAudio) throw e;
      stream = await navigator.mediaDevices.getUserMedia({ video: vid, audio: false });
      toast('Microphone is off, so videos will have no sound.');
    }
    video.srcObject = stream;
    video.classList.toggle('mirror', facing === 'user');
    $('#msg').hidden = true;
    await video.play().catch(() => {});
    setupZoom();
  } catch (e) {
    showCamError(e);
  }
}

function setupZoom(){
  const t = stream && stream.getVideoTracks()[0];
  const caps = t && t.getCapabilities ? t.getCapabilities() : {};
  hwZoom = caps.zoom && caps.zoom.max > caps.zoom.min ? caps.zoom : null;
  const zr = $('#zr');
  zr.min = hwZoom ? hwZoom.min : 1;
  zr.max = hwZoom ? Math.min(hwZoom.max, hwZoom.min * 8) : 5;
  applyZoom(+zr.min);
}

function applyZoom(z){
  const zr = $('#zr');
  zoom = Math.max(+zr.min, Math.min(+zr.max, z));
  zr.value = zoom;
  if (hwZoom) {
    video.style.setProperty('--z', 1);
    const t = stream.getVideoTracks()[0];
    t.applyConstraints({ advanced: [{ zoom }] }).catch(() => {});
  } else video.style.setProperty('--z', zoom);
}

function zoomAllowed(){
  if (!hwZoom && mode === 'video') { toast('Zoom in video isn’t supported on this device.'); return false; }
  return true;
}

function showZoom(){
  const zb = $('#zoombar'); zb.classList.remove('hide');
  clearTimeout(zoomTimer); zoomTimer = setTimeout(() => zb.classList.add('hide'), 2000);
}

function nudge(z){ if (zoomAllowed()) { applyZoom(z); showZoom(); } }
const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);

function countdown(fn){
  if (cdId) { clearInterval(cdId); cdId = null; $('#cd').hidden = true; return; }   // tap again to cancel
  let n = [0, 3, 10][opts.timer];
  if (!n) return fn();
  const el = $('#cd'); el.hidden = false; el.textContent = n; click();
  cdId = setInterval(() => {
    n--;
    if (n <= 0) { clearInterval(cdId); cdId = null; el.hidden = true; fn(); }
    else { el.textContent = n; click(); }
  }, 1000);
}

function applyOpts(){
  video.classList.toggle('retro', !!opts.retro);
  $('#grid').hidden = !opts.grid;
  $('#sqmask').hidden = !(opts.square && mode === 'photo');
  document.querySelectorAll('#panel .seg').forEach(sg =>
    [...sg.children].forEach((b, i) => b.classList.toggle('on', i === opts[sg.dataset.k])));
}

function buildPanel(){
  [['Retro', ['Off', 'On'], 'retro'], ['Grid', ['Off', 'On'], 'grid'], ['Timer', ['Off', '3s', '10s'], 'timer'], ['Square', ['Off', 'On'], 'square']]
  .forEach(([name, vals, k]) => {
    const r = document.createElement('div'); r.className = 'row'; r.innerHTML = '<span>' + name + '</span>';
    const sg = document.createElement('div'); sg.className = 'seg'; sg.dataset.k = k;
    vals.forEach((v, i) => {
      const b = document.createElement('button'); b.textContent = v;
      b.onclick = () => { opts[k] = i; applyOpts(); }; sg.append(b);
    });
    r.append(sg); $('#panel').append(r);
  });
  applyOpts();
}

function click(){
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'square'; o.frequency.value = 1400;
    g.gain.setValueAtTime(.06, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + .05);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + .06);
  } catch (e) {}
}

// ---- old-iPhone look: heavier shadows, warm highlights / cool shadows, glow, blotchy grain, vignette
const T = 256, LUT = new Float32Array(256);
for (let i = 0; i < 256; i++) LUT[i] = Math.max(0, Math.min(1, .5 + (Math.pow(i / 255, 1.1) - .5) * 1.15));
const NL = new Float32Array(T * T), NC = new Float32Array(T * T * 3);
for (let i = 0; i < T * T; i++) NL[i] = (Math.random() - .5) * .028;
for (let y = 0; y < T; y += 2) for (let x = 0; x < T; x += 2) for (let c = 0; c < 3; c++) {
  const v = (Math.random() - .5) * .07;
  for (let dy = 0; dy < 2; dy++) for (let dx = 0; dx < 2; dx++) NC[((y + dy) * T + x + dx) * 3 + c] = v;
}
let vig = null, vigW = 0, vigH = 0, bloomCv = null;

function vigMap(w, h){
  if (vigW !== w || vigH !== h) {
    vig = new Float32Array(w * h); vigW = w; vigH = h;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const r = Math.hypot((x - w / 2) / (w / 2), (y - h / 2) / (h / 2)) / 1.414;
      vig[y * w + x] = 1 - .25 * r * r;
    }
  }
  return vig;
}

function retroFX(cv){
  const w = cv.width, h = cv.height, cx = cv.getContext('2d', { willReadFrequently: true });
  const d = cx.getImageData(0, 0, w, h), p = d.data, vm = vigMap(w, h);
  const ox = (Math.random() * T) | 0, oy = (Math.random() * T) | 0, lut = LUT, nl = NL, nc = NC, TT = T;
  for (let y = 0, i = 0; y < h; y++) {
    const ty = ((y + oy) % TT) * TT;
    for (let x = 0; x < w; x++, i += 4) {
      let r = lut[p[i]], g = lut[p[i + 1]], b = lut[p[i + 2]];
      const L = (r + g + b) / 3, hi = L * L, lo = (1 - L) * (1 - L);
      r += .035 * hi - .015 * lo; b += -.03 * hi + .02 * lo;
      const gr = (r + g + b) / 3;
      r = gr + (r - gr) * 1.18; g = gr + (g - gr) * 1.18; b = gr + (b - gr) * 1.18;
      const k = ty + ((x + ox) % TT), n = nl[k], cw = .4 + .6 * (1 - gr), m = vm[y * w + x] * 255;
      p[i] = (r + n + nc[k * 3] * cw) * m;
      p[i + 1] = (g + n + nc[k * 3 + 1] * cw) * m;
      p[i + 2] = (b + n + nc[k * 3 + 2] * cw) * m;
    }
  }
  cx.putImageData(d, 0, 0);
  // soft glow around bright lights
  const sw = Math.max(8, w >> 3), sh = Math.max(8, h >> 3);
  bloomCv = bloomCv || document.createElement('canvas');
  if (bloomCv.width !== sw || bloomCv.height !== sh) { bloomCv.width = sw; bloomCv.height = sh; }
  const sx = bloomCv.getContext('2d', { willReadFrequently: true });
  sx.drawImage(cv, 0, 0, sw, sh);
  const sd = sx.getImageData(0, 0, sw, sh), q = sd.data;
  for (let i = 0; i < q.length; i += 4) {
    const m = Math.max(0, Math.min(1, ((q[i] + q[i + 1] + q[i + 2]) / 765 - .72) / .28));
    q[i] *= m; q[i + 1] *= m; q[i + 2] *= m;
  }
  sx.putImageData(sd, 0, 0);
  cx.save(); cx.globalCompositeOperation = 'lighter'; cx.globalAlpha = .4;
  cx.imageSmoothingEnabled = true; cx.imageSmoothingQuality = 'high';
  cx.drawImage(bloomCv, 0, 0, w, h); cx.restore();
}

function satBoost(cx, w, h){   // old-iPhone colour: +18% saturation
  const d = cx.getImageData(0, 0, w, h), p = d.data;
  for (let i = 0; i < p.length; i += 4) {
    const l = .299 * p[i] + .587 * p[i + 1] + .114 * p[i + 2];
    p[i] += (p[i] - l) * .18; p[i + 1] += (p[i + 1] - l) * .18; p[i + 2] += (p[i + 2] - l) * .18;
  }
  cx.putImageData(d, 0, 0);
}

function retroStream(){   // draws the camera at 480px with the retro colour, records that
  const k = 480 / Math.max(video.videoWidth, video.videoHeight);
  const rc = document.createElement('canvas');
  rc.width = Math.round(video.videoWidth * k); rc.height = Math.round(video.videoHeight * k);
  const cx = rc.getContext('2d', { willReadFrequently: true });
  let on = true;
  (function loop(){ if (!on) return; cx.drawImage(video, 0, 0, rc.width, rc.height); retroFX(rc); requestAnimationFrame(loop); })();
  const out = rc.captureStream(30);
  stream.getAudioTracks().forEach(t => out.addTrack(t));
  return { out, stop(){ on = false; } };
}

function grabFrame(){
  const c = document.createElement('canvas');
  c.width = 160; c.height = Math.round(160 * video.videoHeight / video.videoWidth) || 120;
  c.getContext('2d').drawImage(video, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', .7);
}

function pickMime(){
  const types = ['video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
  return types.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
}

function setRecUI(on){
  recording = on;
  $('#opts').hidden = on;
  $('#shutter').classList.toggle('rec', on);
  $('#timer').hidden = !on;
}

function tick(){
  const s = Math.floor((Date.now() - recStart) / 1000);
  $('#tt').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}

function startRec(){
  if (!stream || !video.videoWidth) return;
  if (!window.MediaRecorder) { toast('Video recording isn’t supported in this browser.'); return; }
  const mime = pickMime();
  const o = mime ? { mimeType: mime } : {};
  try {
    if (opts.retro) { try { retroSrc = retroStream(); } catch (e) { retroSrc = null; } }
    if (retroSrc) o.videoBitsPerSecond = 250000;   // low bitrate, like a 3GS
    recorder = new MediaRecorder(retroSrc ? retroSrc.out : stream, o);
  } catch (e) { toast('Couldn’t start recording.'); return; }
  chunks = []; poster = grabFrame();
  recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    if (retroSrc) { retroSrc.stop(); retroSrc = null; }
    const type = recorder.mimeType || mime || 'video/mp4';
    const blob = new Blob(chunks, { type });
    const url = URL.createObjectURL(blob);
    photos.unshift({ blob, url, video: true, thumb: poster,
      name: 'VID_' + String(Date.now()).slice(-6) + '.' + (type.includes('mp4') ? 'mp4' : 'webm') });
    $('#thumb').style.backgroundImage = 'url(' + poster + ')';
    renderRoll();
  };
  recorder.start(1000);
  recStart = Date.now(); click(); setRecUI(true);
  tick(); timerId = setInterval(tick, 250);
}

function stopRec(){
  clearInterval(timerId); click(); setRecUI(false);
  if (recorder && recorder.state !== 'inactive') recorder.stop();
}

function shoot(){
  if (!video.videoWidth) return;
  const c = document.createElement('canvas');
  c.width = video.videoWidth; c.height = video.videoHeight;
  const z = hwZoom ? 1 : zoom, vw = c.width, vh = c.height;   // digital zoom crops the centre
  let sw = vw / z, sh = vh / z, ow = vw, oh = vh;
  if (opts.square) {   // crop to the square shown in the viewfinder
    const cw = video.clientWidth, ch = video.clientHeight, sc = Math.max(cw / vw, ch / vh);
    sw = sh = Math.min(cw, ch) / sc / z; ow = oh = Math.round(sw);
  }
  if (opts.retro) { const k = Math.min(1, 1024 / Math.max(ow, oh)); ow = Math.round(ow * k); oh = Math.round(oh * k); }
  c.width = ow; c.height = oh;
  const cx = c.getContext('2d', { willReadFrequently: true });
  cx.drawImage(video, (vw - sw) / 2, (vh - sh) / 2, sw, sh, 0, 0, ow, oh);
  if (opts.retro) retroFX(c);
  const b = $('#blink'); b.classList.remove('go'); void b.offsetWidth; b.classList.add('go');
  click();
  c.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    photos.unshift({ blob, url, name: 'IMG_' + String(Date.now()).slice(-6) + '.jpg' });
    $('#thumb').style.backgroundImage = 'url(' + url + ')';
    renderRoll();
  }, 'image/jpeg', .92);
}

async function save(p){
  const file = new File([p.blob], p.name, { type: p.blob.type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = p.url; a.download = p.name; a.click();
}

function renderRoll(){
  const l = $('#list'); l.innerHTML = '';
  if (!photos.length) { l.innerHTML = '<p class="empty">No photos yet</p>'; return; }
  const h = document.createElement('p'); h.className = 'hint';
  h.textContent = 'Tap Save, or touch and hold a photo, to keep it.'; l.append(h);
  photos.forEach(p => {
    const d = document.createElement('div'); d.className = 'item';
    let i;
    if (p.video) { i = document.createElement('video'); i.src = p.url; i.controls = true; i.playsInline = true; }
    else { i = new Image(); i.src = p.url; }
    const b = document.createElement('button'); b.className = 'btn small'; b.textContent = 'Save';
    b.onclick = () => save(p);
    d.append(i, b); l.append(d);
  });
}

$('#shutter').addEventListener('click', () => {
  if (mode === 'photo') countdown(shoot);
  else if (recording) stopRec();
  else countdown(startRec);
});
$('#switch').addEventListener('click', () => {
  if (recording) return;
  mode = mode === 'photo' ? 'video' : 'photo';
  $('#switch').classList.toggle('vid', mode === 'video');
  $('#shutter').classList.toggle('vid', mode === 'video');
  applyOpts();
  start();
});
$('#flip').addEventListener('click', () => { if (recording) return; facing = facing === 'user' ? 'environment' : 'user'; start(); });
$('#flash').addEventListener('click', () => {
  flashMode = (flashMode + 1) % 3;
  $('#flashLabel').textContent = flashLabels[flashMode];
  $('#flash').classList.toggle('off', flashMode === 2);
});
$('#thumb').addEventListener('click', () => { renderRoll(); $('#roll').hidden = false; });
$('#done').addEventListener('click', () => { $('#roll').hidden = true; });
$('#stage').addEventListener('click', e => {
  $('#panel').hidden = true;
  const f = document.createElement('div'); f.className = 'focus';
  f.style.left = e.clientX + 'px'; f.style.top = e.clientY + 'px';
  document.body.appendChild(f); setTimeout(() => f.remove(), 1000);
});

const st = $('#stage');
st.addEventListener('touchstart', e => { if (e.touches.length === 2) pinch = { d: dist(e.touches), z: zoom }; }, { passive: true });
st.addEventListener('touchmove', e => {
  if (pinch && e.touches.length === 2) { e.preventDefault(); nudge(pinch.z * dist(e.touches) / pinch.d); }
}, { passive: false });
st.addEventListener('touchend', e => { if (e.touches.length < 2) pinch = null; });
st.addEventListener('wheel', e => { e.preventDefault(); nudge(zoom - e.deltaY * 0.002); }, { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
$('#zr').addEventListener('input', e => { if (zoomAllowed()) { applyZoom(+e.target.value); showZoom(); } else applyZoom(1); });
$('#zm').addEventListener('click', () => nudge(zoom - 0.5));
$('#zp').addEventListener('click', () => nudge(zoom + 0.5));

buildPanel();
$('#opts').addEventListener('click', () => { const p = $('#panel'); p.hidden = !p.hidden; });
start();
</script>
</body>
</html>
